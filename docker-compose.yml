
services:
  sofia-bot:
    build: .
    container_name: sofia_bot
    env_file:
      - .env
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: mysql_sofia
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chatbot_terapia
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
